# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 85%
        threshold: 5%
        if_ci_failed: error

# Paths are relative to the repository root, where the crate is `dotscope/`.
ignore:
  - "dotscope/tests/**/*"
  - "dotscope/examples/**/*"
  - "dotscope/benches/**/*"
  - "dotscope/fuzz/**/*"
  - "dotscope/src/testkit/**/*"

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

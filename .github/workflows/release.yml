name: Release and Publish

# Publishing is driven by publishing a GitHub release, not by pushing to a
# branch. Create the release and its tag when you intend to ship; until then
# nothing reaches crates.io, so merging to any branch is always safe.
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Derive the version from the release tag and hold it against Cargo.toml, so a
  # mistyped tag fails here rather than shipping under the wrong version.
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Resolve and verify version
      id: version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION="${TAG#v}"
        FAILED=0
        for MANIFEST in dotscope/Cargo.toml dotscope-cli/Cargo.toml; do
          DECLARED=$(grep '^version = ' "$MANIFEST" | head -1 | cut -d '"' -f 2)
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Release tag ${TAG} implies version ${VERSION}, but ${MANIFEST} declares ${DECLARED}"
            FAILED=1
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing v${VERSION}"

  # Then ensure all tests pass
  test:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    needs: version

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Install Mono and Z3
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-utils libz3-dev

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
      env:
        RUSTFLAGS: "-Dwarnings"

    - name: Run tests
      run: cargo test --release --lib --verbose

    - name: Run doc tests
      run: cargo test --release --doc

    - name: Check documentation
      run: cargo doc --no-deps

  # Build CLI binaries for all platforms and attach them to the release
  build-cli:
    name: Build CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dotscope
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: dotscope
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dotscope.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: release-${{ matrix.target }}

    - name: Build CLI
      run: cargo build --release --target ${{ matrix.target }} -p dotscope-cli

    - name: Package binary (Unix)
      if: runner.os != 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        zip dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip ${{ matrix.artifact }}
        mv dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip ${{ github.workspace }}/

    - name: Package binary (Windows)
      if: runner.os == 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath "${{ github.workspace }}\dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip"
      shell: pwsh

    - name: Upload release asset
      run: gh release upload "${{ github.event.release.tag_name }}" "dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [version, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Verify package can be published
      run: cargo publish -p dotscope --dry-run

    - name: Publish to crates.io
      run: cargo publish -p dotscope
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Verify documentation builds correctly
  verify-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    needs: [version, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Build documentation for docs.rs
      run: |
        cargo doc -p dotscope --no-deps --document-private-items
        echo "Documentation builds successfully"
        echo "Documentation will be automatically available at https://docs.rs/dotscope after publishing"

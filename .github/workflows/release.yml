name: Release and Publish

# Publishing is driven by publishing a GitHub release, not by pushing to a
# branch. Create the release and its tag when you intend to ship; until then
# nothing reaches crates.io, so merging to any branch is always safe.
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Derive the version from the release tag and hold it against Cargo.toml, so a
  # mistyped tag fails here rather than shipping under the wrong version. A release
  # whose commit never landed on main fails here too, before anything is built.
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 0       # merge-base needs real history

    # A GitHub release can be cut from any commit, including one that never
    # landed on main. Releases are restricted to commits contained in main.
    - name: Refuse releases not contained in main
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main \
          || { echo "::error::release commit is not contained in main"; exit 1; }

    - name: Resolve and verify version
      id: version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION="${TAG#v}"
        FAILED=0
        for MANIFEST in dotscope/Cargo.toml dotscope-cli/Cargo.toml; do
          DECLARED=$(grep '^version = ' "$MANIFEST" | head -1 | cut -d '"' -f 2)
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Release tag ${TAG} implies version ${VERSION}, but ${MANIFEST} declares ${DECLARED}"
            FAILED=1
          fi
        done
        if [ "$FAILED" -ne 0 ]; then
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing v${VERSION}"

  # The same checks as the Linux CI job: formatting, clippy, the oracle test tier
  # (every test, external tools required), the doc tests, and the build without
  # default features.
  test:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    needs: version

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Warm up .NET SDK
      run: |
        dotnet --info
        dotnet new console -n warmup -o ${{ runner.temp }}/warmup
        dotnet build ${{ runner.temp }}/warmup

    - name: Install Mono and Z3
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-utils libz3-dev

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-features --all-targets -- -D warnings

    - name: Run tests (oracle tier)
      run: make test-oracle

    - name: Run doc tests
      # Capped: each doc test links its own binary, and uncapped they exhaust memory.
      run: cargo test --workspace --release --doc --features z3 -- --test-threads=4

    - name: Run tests without default features
      run: cargo test -p dotscope --no-default-features --profile ci-test --lib --bins --tests

  # Build CLI binaries for all platforms and attach them to the release
  build-cli:
    name: Build CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [version, test]

    # Needed to attach the built binaries to the release. The default
    # GITHUB_TOKEN permission is read-only, which makes the upload fail with
    # "Resource not accessible by integration".
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dotscope
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: dotscope
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dotscope.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: release-${{ matrix.target }}

    - name: Build CLI
      run: cargo build --release --target ${{ matrix.target }} -p dotscope-cli

    - name: Package binary (Unix)
      if: runner.os != 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        zip dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip ${{ matrix.artifact }}
        mv dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip ${{ github.workspace }}/

    - name: Package binary (Windows)
      if: runner.os == 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath "${{ github.workspace }}\dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip"
      shell: pwsh

    - name: Upload release asset
      run: gh release upload "${{ github.event.release.tag_name }}" "dotscope-v${{ needs.version.outputs.version }}-${{ matrix.target }}.zip" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [version, test, build-cli, verify-docs]

    permissions:
      contents: read
      id-token: write        # required to mint the crates.io OIDC token

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Verify package can be published
      run: cargo publish -p dotscope --dry-run

    - name: Authenticate to crates.io
      uses: rust-lang/crates-io-auth-action@v1
      id: auth

    - name: Publish to crates.io
      run: cargo publish -p dotscope
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Build the documentation the way docs.rs will (every feature, `--cfg docsrs`),
  # with warnings denied: a broken link fails the release before it publishes.
  verify-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    needs: version

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Build documentation as docs.rs does
      env:
        RUSTDOCFLAGS: "--cfg docsrs -Dwarnings"
      run: cargo doc -p dotscope --all-features --no-deps
